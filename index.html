<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>СССР, 1974 – 3D (работает без сервера)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Times New Roman', serif; }
        #hud {
            position: absolute; top: 20px; left: 20px;
            background: rgba(139, 0, 0, 0.85); color: #ffd700;
            padding: 12px 25px; border-radius: 20px; border: 2px solid #b8860b;
            pointer-events: none; font-size: 1.3rem; letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        #hud span { margin: 0 12px; }
        #instruction {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px;
            border-radius: 15px; font-size: 0.9rem; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="hud">
        💰 <span id="money">150</span> руб.
        😊 <span id="mood">70</span>%
        ❤️ <span id="health">80</span>%
        📞 <span id="blat">20</span>
    </div>
    <div id="instruction">🖱 Левая кнопка – вращать | Колёсико – приблизить | Правая кнопка – панорама</div>

    <!-- Подключаем Three.js через CDN (старая добрая классика) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.130.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.130.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.130.0/examples/js/renderers/CSS2DRenderer.js"></script>

    <script>
        // ---------- RPG ДАННЫЕ ----------
        const playerData = { money: 150, mood: 70, health: 80, blat: 20 };
        function updateHUD() {
            document.getElementById('money').textContent = playerData.money;
            document.getElementById('mood').textContent = playerData.mood;
            document.getElementById('health').textContent = playerData.health;
            document.getElementById('blat').textContent = playerData.blat;
        }

        // ---------- СЦЕНА ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x4a2c1a);

        // Камера
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 8);
        camera.lookAt(0, 1, 0);

        // Рендереры
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // ---------- СВОБОДНОЕ УПРАВЛЕНИЕ КАМЕРОЙ ----------
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.update();

        // ---------- ОСВЕЩЕНИЕ ----------
        const ambientLight = new THREE.AmbientLight(0xffeebb, 0.8);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        sunLight.position.set(8, 12, 4);
        sunLight.castShadow = true;
        sunLight.receiveShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 50;
        sunLight.shadow.camera.left = -15;
        sunLight.shadow.camera.right = 15;
        sunLight.shadow.camera.top = 15;
        sunLight.shadow.camera.bottom = -10;
        scene.add(sunLight);

        // ---------- КОМНАТА ----------
        const floorGeometry = new THREE.PlaneGeometry(8, 8);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        floor.receiveShadow = true;
        scene.add(floor);

        // Сетка и оси
        const gridHelper = new THREE.GridHelper(8, 20, 0x000000, 0x444444);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);
        scene.add(new THREE.AxesHelper(5));

        // Стены
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xb0a090, roughness: 0.8 });
        function createWall(width, height, depth, x, y, z, rotY = 0) {
            const geom = new THREE.BoxGeometry(width, height, depth);
            const wall = new THREE.Mesh(geom, wallMaterial);
            wall.position.set(x, y, z);
            wall.rotation.y = rotY;
            wall.receiveShadow = true;
            wall.castShadow = true;
            scene.add(wall);
            return wall;
        }
        createWall(8, 3, 0.3, 0, 1.5, -4);        // задняя
        createWall(8, 3, 0.3, 0, 1.5, 4, Math.PI); // передняя
        createWall(0.3, 3, 8, -4, 1.5, 0, Math.PI/2); // левая
        createWall(0.3, 3, 8, 4, 1.5, 0, Math.PI/2);  // правая

        // Потолок
        const ceilingGeom = new THREE.PlaneGeometry(8, 8);
        const ceiling = new THREE.Mesh(ceilingGeom, new THREE.MeshStandardMaterial({ color: 0xddccaa }));
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = 3;
        ceiling.receiveShadow = true;
        scene.add(ceiling);

        // Окно
        const windowFrame = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.2, 0.1), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
        windowFrame.position.set(0, 2, -3.85);
        scene.add(windowFrame);
        const windowGlass = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 1.0), new THREE.MeshStandardMaterial({ color: 0xaaccff, emissive: new THREE.Color(0x112233) }));
        windowGlass.position.set(0, 2, -3.9);
        scene.add(windowGlass);

        // Стол и стул
        const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 0.8), new THREE.MeshStandardMaterial({ color: 0x6b3a2a }));
        tableTop.position.set(2, 0.6, 1.5);
        scene.add(tableTop);
        const tableLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.6, 8), new THREE.MeshStandardMaterial({ color: 0x4a2a1a }));
        tableLeg.position.set(2, 0.3, 1.5);
        scene.add(tableLeg);
        const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.5), new THREE.MeshStandardMaterial({ color: 0x8b0000 }));
        chairSeat.position.set(2.5, 0.45, 1.2);
        scene.add(chairSeat);
        const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.1), new THREE.MeshStandardMaterial({ color: 0x8b0000 }));
        chairBack.position.set(2.5, 0.8, 1.45);
        scene.add(chairBack);

        // Ковёр
        const carpet = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 1.8), new THREE.MeshStandardMaterial({ color: 0x9b2020, roughness: 1 }));
        carpet.rotation.x = -Math.PI/2;
        carpet.position.set(-1.5, 0.01, -0.5);
        carpet.receiveShadow = true;
        scene.add(carpet);

        // ---------- ПЕРСОНАЖ (капсула) ----------
        const playerGeometry = new THREE.CapsuleGeometry(0.3, 0.8, 4, 8);
        const playerMaterial = new THREE.MeshStandardMaterial({ color: 0xd4a76a });
        const playerMesh = new THREE.Mesh(playerGeometry, playerMaterial);
        playerMesh.castShadow = true;
        playerMesh.receiveShadow = true;
        playerMesh.position.set(0, 1.0, 0);
        scene.add(playerMesh);

        // Глаза
        const eyeGeom = new THREE.SphereGeometry(0.1);
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
        const leftEye = new THREE.Mesh(eyeGeom, eyeMat);
        leftEye.position.set(-0.15, 0.4, 0.25);
        const rightEye = new THREE.Mesh(eyeGeom, eyeMat);
        rightEye.position.set(0.15, 0.4, 0.25);
        playerMesh.add(leftEye);
        playerMesh.add(rightEye);

        // ---------- АНИМАЦИЯ ----------
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        updateHUD();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('Если видишь эту надпись — сцена загружена. Крути мышкой!');
    </script>
</body>
</html>
